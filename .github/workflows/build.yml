name: Build Forhan
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      standalone_layout_diagnostics:
        description: Run the failing standalone layout cases and retain renderer traces
        type: boolean
        default: false
        required: false
      platform_layout_diagnostics:
        description: Inspect native platform geometry and failing source-editing cases
        type: boolean
        default: false
        required: false
      platform_diagnostic_pattern:
        description: Optional test title filter for focused native platform diagnostics
        type: string
        default: ''
        required: false
      observe_native_keys:
        description: Retain passive source-key event observations for explicit diagnostics
        type: boolean
        default: false
        required: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            package: --win portable --x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            package: --mac dmg zip --x64 --config.mac.identity=-
          - os: macos-15
            platform: darwin
            arch: arm64
            package: --mac dmg zip --arm64 --config.mac.identity=-
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run build
      - name: Prepare actual macOS display for native viewport fixtures
        if: ${{ matrix.platform == 'darwin' }}
        run: |
          brew install displayplacer
          node scripts/prepare-macos-display.ts
          killall Dock || test $? -eq 1
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: npm run test:ui
        if: ${{ !inputs.standalone_layout_diagnostics && !inputs.platform_layout_diagnostics }}
      - name: Run focused standalone layout diagnostics
        if: ${{ inputs.standalone_layout_diagnostics }}
        run: npx playwright test native-body-grid-origin.spec.ts paragraph-line-grid.spec.ts print-layout.spec.ts --grep "standalone|share document layout" --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/layout-report.json
      - name: Run focused native platform diagnostics
        if: ${{ inputs.platform_layout_diagnostics }}
        run: node scripts/run-native-diagnostics.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/platform-report.json
          FORHAN_DIAGNOSTIC_GREP: ${{ inputs.platform_diagnostic_pattern }}
          FORHAN_KEY_SOURCE_OBSERVE: ${{ inputs.observe_native_keys && '1' || '' }}
      - run: node node_modules/electron-builder/cli.js ${{ matrix.package }} --publish never
        if: ${{ !inputs.standalone_layout_diagnostics && !inputs.platform_layout_diagnostics }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
      - run: npm run test:packaged -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        if: ${{ !inputs.standalone_layout_diagnostics && !inputs.platform_layout_diagnostics }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.platform == 'darwin' }}
        with:
          name: Forhan-native-display-${{ matrix.arch }}
          path: release/validation/native-display-darwin-${{ matrix.arch }}.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forhan-renderer-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.standalone_layout_diagnostics && !inputs.platform_layout_diagnostics }}
        with:
          name: Forhan-validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/validation/*.json
            test-results/packaged/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.standalone_layout_diagnostics && !inputs.platform_layout_diagnostics }}
        with:
          name: Forhan-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
